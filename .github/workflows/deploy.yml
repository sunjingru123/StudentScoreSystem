name: Build and Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================
  # 质量门禁 1：后端编译 + 测试
  #
  # @SpringBootTest 上下文测试需要可用的 PostgreSQL，
  # 因此这里通过 services 拉起一个临时数据库。
  # 任何编译或测试失败都会让本任务失败，
  # 从而使依赖它的 build-and-push / deploy 不会执行。
  # =========================================================
  backend-test:
    name: Backend Compile & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: student_score_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile & test backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/student_score_system
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
        run: sh scripts/verify-backend.sh

  # =========================================================
  # 质量门禁 2：前端构建
  # =========================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # =========================================================
  # 构建并推送镜像（依赖两个质量门禁，失败则不会推送）
  # =========================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. 编译并推送 Spring Boot 后端
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./student-score-system
          file: ./student-score-system/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/student-score-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/student-score-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. 编译并推送 Vue3 前端
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/student-score-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/student-score-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # 部署（等待镜像构建成功后才执行，使用提交 SHA 的不可变镜像）
  # =========================================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
      - build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Copy compose & sql to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,sql"
          target: "/opt/student-score-system"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          IMAGE_TAG: ${{ github.sha }}
          DB_USER: ${{ secrets.DB_USER || 'deng' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: IMAGE_REPO,IMAGE_TAG,DB_USER,DB_PASSWORD,JWT_SECRET,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu

            if [ -z "${JWT_SECRET}" ]; then
              echo "GitHub Actions Secret JWT_SECRET 未配置，已中止部署以保护服务器现有配置"
              exit 1
            fi

            if [ "$(printf %s "${JWT_SECRET}" | wc -c)" -lt 32 ]; then
              echo "JWT_SECRET 长度不足 32 字节，已中止部署"
              exit 1
            fi

            mkdir -p /opt/student-score-system/uploads
            cd /opt/student-score-system

            # 仅在必填密钥通过校验后更新环境文件，避免空 Secret 覆盖线上有效配置。
            cat <<EOF > .env
            IMAGE_REPO=${IMAGE_REPO}
            IMAGE_TAG=${IMAGE_TAG}
            DB_USER=${DB_USER:-deng}
            DB_PASSWORD=${DB_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            EOF

            # 登录 GHCR 并拉取当前提交对应的不可变镜像。
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose -f docker-compose.prod.yml pull

            # 应用数据库表结构
            #
            # 后端镜像里没有 Flyway / Liquibase，
            # 只换镜像不会改变表结构，所以每次部署都幂等地跑一遍建表脚本：
            # CREATE TABLE / INDEX IF NOT EXISTS + ADD COLUMN IF NOT EXISTS，
            # 可重复执行，会给已存在的表补上缺失字段
            # （例如 score_rule.department_id、score_apply.final_status）。
            #
            # --single-transaction 让整个脚本在单一事务里执行：
            #   1. 任何一步失败时全部回滚，不会留下“半截”结构；
            #   2. 与脚本内的幂等写法（IF NOT EXISTS / DO 守卫）配合，
            #      重复部署不会重复改结构，也不会丢失历史数据。
            # 脚本内已不再包含 BEGIN/COMMIT，避免提前提交破坏原子性。
            if ! docker exec -i -e PGPASSWORD="${DB_PASSWORD}" student-score-postgres \
                 psql -U "${DB_USER}" -d student_score_system -v ON_ERROR_STOP=1 --single-transaction \
                 < sql/02_create_table.sql; then

              echo "数据库表结构脚本执行失败，已中止部署"

              exit 1
            fi

            # 兼容早期由 docker run 或其他 Compose 项目创建的同名容器，
            # 防止名称冲突导致“镜像已推送但服务未切换”。
            docker rm -f student-score-frontend student-score-backend 2>/dev/null || true

            # 启动当前提交对应的前后端容器。
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            # 将独立运行的 PostgreSQL 容器加入应用网络后重启后端，使其立即重连。
            docker network connect score-network student-score-postgres 2>/dev/null || true
            docker restart student-score-backend

            # 清理无用镜像
            docker image prune -f
