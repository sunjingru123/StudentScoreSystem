name: Build and Push to GHCR

on:
  push:
    branches: [main]
    tags: ['v*'] # 打 tag 时也触发
  pull_request:
    branches: [main] # PR 时只构建不推送（可选）

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # 自动取 "owner/repo" 作为镜像名

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ← 必须声明，否则 GITHUB_TOKEN 无推送权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 自动注入，无需手动配 Secret

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }} # PR 时不推送
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max # 利用 GitHub Actions Cache 加速构建
