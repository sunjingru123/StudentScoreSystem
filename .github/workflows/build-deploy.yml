name: Build & Push GHCR & Deploy to Server

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/student-score-app
  APP_CONTAINER: student-score-app
  APP_PORT: 8080

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 打包
      - name: Maven Build
        run: |
          cd student-score-system
          mvn clean package -DskipTests

      # 4. 配置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. 构建并推送 Docker 镜像
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./student-score-system
          file: ./student-score-system/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 7. 检查 SSH Secret
      - name: Check SSH Secret
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SERVER_SSH_KEY is EMPTY"
            exit 1
          fi

          echo "SERVER_SSH_KEY exists"
          echo "SSH key length: ${#SSH_KEY}"

      # 8. SSH 部署到服务器
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            APP_CONTAINER=${{ env.APP_CONTAINER }}

            echo "========================================"
            echo "开始部署学生加减分系统"
            echo "========================================"

            echo "登录 GHCR..."

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.repository_owner }} \
              --password-stdin

            echo "拉取 Docker 镜像..."

            docker pull "$IMAGE"

            echo "停止旧容器..."

            docker stop "$APP_CONTAINER" 2>/dev/null || true

            echo "删除旧容器..."

            docker rm "$APP_CONTAINER" 2>/dev/null || true

            echo "启动新容器..."

            docker run -d \
              --name "$APP_CONTAINER" \
              --restart unless-stopped \
              -p 127.0.0.1:${{ env.APP_PORT }}:8080 \
              -e DB_HOST=host.docker.internal \
              -e DB_PORT=65432 \
              -e DB_NAME=mydb \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              "$IMAGE"

            echo "等待应用启动..."

            sleep 10

            echo "检查容器状态..."

            docker ps --filter "name=^/${APP_CONTAINER}$"

            echo "========================================"
            echo "部署完成"
            echo "========================================"
