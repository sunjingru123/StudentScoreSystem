services:
  postgres:
    image: postgres:18
    container_name: student-score-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: student_score_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./student_score_system_backup.sql:/docker-entrypoint-initdb.d/01_backup.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_score_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./student-score-system
      dockerfile: Dockerfile

    container_name: student-score-backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/student_score_system
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: student-score-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  postgres_data: