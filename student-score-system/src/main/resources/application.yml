spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_score_system}
    username: ${DB_USERNAME:deng}
    password: ${DB_PASSWORD:}

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # 生产环境必须设置 JWT_SECRET；应用不会再使用固定默认密钥。
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
