name: Build & Push GHCR & Deploy to Server

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/student-score-app
  APP_CONTAINER: student-score-app
  APP_PORT: 8080

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build Spring Boot application
      - name: Maven Build
        run: |
          cd student-score-system
          mvn clean package -DskipTests

      # 4. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./student-score-system
          file: ./student-score-system/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Check SSH private key Secret
      - name: Check SSH Secret
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SERVER_SSH_KEY is EMPTY"
            exit 1
          fi

          echo "SERVER_SSH_KEY exists"
          echo "SSH key length: ${#SSH_KEY}"

      # 8. Deploy to server via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            APP_CONTAINER=${{ env.APP_CONTAINER }}

            echo "========================================"
            echo "Starting deployment"
            echo "========================================"

            echo "Logging in to GHCR..."

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.repository_owner }} \
              --password-stdin

            echo "Pulling Docker image..."

            docker pull "$IMAGE"

            echo "Stopping old container..."

            docker stop "$APP_CONTAINER" 2>/dev/null || true

            echo "Removing old container..."

            docker rm "$APP_CONTAINER" 2>/dev/null || true

            echo "Starting new container..."

            docker run -d \
              --name "$APP_CONTAINER" \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:8080 \
              -e DB_HOST=host.docker.internal \
              -e DB_PORT=65432 \
              -e DB_NAME=mydb \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              "$IMAGE"

            echo "Waiting for application to start..."

            sleep 10

            echo "Checking container status..."

            docker ps --filter "name=^/${APP_CONTAINER}$"

            echo "========================================"
            echo "Deployment completed"
            echo "========================================"