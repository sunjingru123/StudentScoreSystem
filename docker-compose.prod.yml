services:
  backend:
    image: ghcr.io/${IMAGE_REPO}/student-score-backend:latest
    container_name: student-score-backend
    restart: unless-stopped
    environment:
      # 直接连接同网络下的 PG 容器名和容器端口 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://student-score-postgres:5432/student_score_system
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-deng}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # JwtConfiguration 启动时会强校验，缺失则应用直接启动失败
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - score-network

  frontend:
    image: ghcr.io/${IMAGE_REPO}/student-score-frontend:latest
    container_name: student-score-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:80" # 仅限本机 3080，由 Caddy 反代
    depends_on:
      - backend
    networks:
      - score-network

networks:
  score-network:
    name: score-network
